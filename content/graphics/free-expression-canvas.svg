<svg width="800" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .canvas-border { fill: none; stroke: #7B3FF2; stroke-width: 3; }
      .guide-text { font-family: 'Lato', Arial, sans-serif; font-size: 16px; fill: #9D6EF5; }
      .title-text { font-family: 'Playfair Display', Georgia, serif; font-size: 28px; fill: #7B3FF2; font-weight: bold; }
      .accent-symbol { fill: #D4AF37; opacity: 0.3; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" class="title-text">
    Free Expression Canvas
  </text>

  <text x="400" y="80" text-anchor="middle" class="guide-text" font-style="italic">
    No rules. No judgment. Just let your hand move.
  </text>

  <!-- Main canvas area -->
  <rect x="50" y="120" width="700" height="750" fill="#FFF8E7" class="canvas-border" rx="10"/>

  <!-- Decorative corner symbols -->
  <text x="70" y="145" font-size="24" class="accent-symbol">✦</text>
  <text x="730" y="145" font-size="24" class="accent-symbol">✦</text>
  <text x="70" y="855" font-size="24" class="accent-symbol">✦</text>
  <text x="730" y="855" font-size="24" class="accent-symbol">✦</text>

  <!-- Subtle grid guide (very light) -->
  <g opacity="0.1">
    <line x1="400" y1="120" x2="400" y2="870" stroke="#7B3FF2" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="50" y1="495" x2="750" y2="495" stroke="#7B3FF2" stroke-width="1" stroke-dasharray="5,5"/>
  </g>

  <!-- Bottom guidance -->
  <text x="400" y="930" text-anchor="middle" font-size="18" fill="#4ECDC4" font-style="italic">
    Let emotions flow onto the page
  </text>

  <text x="400" y="960" text-anchor="middle" font-size="14" fill="#888888">
    Doodle • Scribble • Draw • Color • Express
  </text>

</svg>