<svg width="600" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B3FF2;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7B3FF2;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Main dividing line -->
  <line x1="50" y1="40" x2="550" y2="40" stroke="url(#dividerGrad)" stroke-width="2"/>

  <!-- Center ornament -->
  <circle cx="300" cy="40" r="15" fill="#D4AF37"/>
  <text x="300" y="48" text-anchor="middle" font-size="20" fill="#7B3FF2">✦</text>

  <!-- Side ornaments -->
  <text x="100" y="48" text-anchor="middle" font-size="16" fill="#4ECDC4" opacity="0.6">◈</text>
  <text x="500" y="48" text-anchor="middle" font-size="16" fill="#4ECDC4" opacity="0.6">◈</text>

</svg>